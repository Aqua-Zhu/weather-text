<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/textslider.css">
<title>Document</title>
</head>
<body>

    <div class="slideText">
        <ul>
            <li>New1</li>
            <li>New2</li>
            <li>New3</li>
            <li>New4</li>
            <li>New5</li>
            <li>New6</li>
            <li>New7</li>
            <li>New8</li>
            <li>New9</li>
            <li>New10</li>
        </ul>
    </div>
    <script src="./js/jquery-1.11.3.min.js"></script>
    <script src="./js/jquery.textslider.js"></script>
    <script>
        $(function(){
            $('.slideText').textslider({
                // 捲動方向(向上 => scrollUp, 向下 => scrollDown)
                direction:'scrollDown',
                // 一次捲動幾列
                scrollNum:2,
                // 捲動速度
                scrollSpeed:500,
                //停頓時間
                pause:500,
            });
        })
    </script>
</body>
</html>
