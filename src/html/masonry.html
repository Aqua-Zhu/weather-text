<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            margin: auto;
        }

        .wrapper {
            width: 300px;
            text-align: center;
            margin: 2px;
            background-color: black;
        }

        .wrapper img {
            width: 100%;
            vertical-align: top;
        }
        .wrapper p{
            color: white;
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="wrapper">
            <img src="./images/image-1.jpg" alt="">
            <p>Lorem, ipsum.</p>
        </div>
        <div class="wrapper">
            <img src="./images/image-2.jpg" alt="">
            <p>Lorem, ipsum.</p>
        </div>
        <div class="wrapper">
            <img src="./images/05.jpg" alt="">
            <p>Lorem, ipsum.</p>
        </div>
        <div class="wrapper">
            <img src="./images/image-3.jpg" alt="">
            <p>Lorem, ipsum.</p>
        </div>
        <div class="wrapper">
            <img src="./images/image-4.jpg" alt="">
            <p>Lorem, ipsum.</p>
        </div>
        <div class="wrapper">
            <img src="./images/06.jpg" alt="">
            <p>Lorem, ipsum.</p>
        </div>
    </div>

    <script src="./js/jquery-1.11.3.min.js"></script>
    <script src="./js/imagesloaded.pkgd.min.js"></script>
    <script src="./js/masonry.pkgd.min.js"></script>
    <script>
        $(function () {
            $('#container').imagesLoaded(function () {
                $('#container').masonry({
                    // 左右留白，頁面置中
                    // 搭配最外層的container
                    // margin: auto;
                    isFitWidth:true
                });
            });
        })
    </script>
</body>

</html>
